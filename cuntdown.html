<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    font-family:Arial, sans-serif;
}


body {

    display:flex;
    justify-content:center;
    align-items:center;

}


#timer {

    color:white;
    font-size:32vw;
    font-weight:bold;
    line-height:1;
    letter-spacing:5px;

}

</style>

</head>


<body>


<div id="timer">
10:00
</div>



<script>


let waktu = 10 * 60;

let waktuAwal = waktu;

let interval = null;



function tampilkan(){

    let menit = Math.floor(waktu / 60);

    let detik = waktu % 60;


    document.getElementById("timer").innerHTML =

    String(menit).padStart(2,"0")
    +
    ":"
    +
    String(detik).padStart(2,"0");

}



function startTimer(){

    if(interval === null){

        interval = setInterval(function(){

            if(waktu > 0){

                waktu--;

                tampilkan();

            }

            else {

                pauseTimer();

            }


        },1000);

    }

}



function pauseTimer(){

    clearInterval(interval);

    interval = null;

}



function resetTimer(){

    pauseTimer();

    waktu = waktuAwal;

    tampilkan();

}



function pilihWaktu(menit){

    pauseTimer();

    waktu = menit * 60;

    waktuAwal = waktu;

    tampilkan();

}




document.addEventListener("keydown", function(e){


    let tombol = e.key.toLowerCase();



    // START
    if(tombol === "s"){

        startTimer();

    }



    // PAUSE
    if(tombol === "p"){

        pauseTimer();

    }



    // RESET
    if(tombol === "r"){

        resetTimer();

    }



    // 10 menit
    if(tombol === "1"){

        pilihWaktu(10);

    }



    // 24 menit
    if(tombol === "2"){

        pilihWaktu(24);

    }


});



tampilkan();


</script>


</body>
</html>
